[project]
name = "example"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
  "dagster-dg-cli",
  "dagster-webserver",
  "xarray>=2026.7.0",
  "dagster_xclim",
  "dagster-object-factory",
  "pooch>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "example"
registry_modules = ["example.components.*"]

[tool.pyright]
venvPath = ".."
venv = ".venv"

[tool.uv.sources]
dagster_object_factory = { git = "https://github.com/mikeblackett/dagster-object-factory.git" }
dagster_xclim = { workspace = true }
