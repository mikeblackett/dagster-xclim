[project]
name = "dagster-xclim"
version = "0.2.0"
description = "Dagster asset factories for xclim indicators."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Mike Blackett", email = "27811528+mikeblackett@users.noreply.github.com" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: Dagster",
  "Topic :: Scientific/Engineering",
  "Operating System :: OS Independent",
]
dependencies = [
  "dagster>=1.13.24",
  "dagster-object-factory>=0.6.0",
  "xarray>=2026.7.0",
  "xclim>=1.0.0",
]

[dependency-groups]
dev = [
  "coverage>=7.16.1",
  "dagster-xclim",
  "jupyterlab>=4.6.4",
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  "ruff>=0.16.9",
]

[project.urls]
Repository = "https://github.com/mikeblackett/dagster-xclim"

[build-system]
requires = ["uv_build>=0.9.29,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
dagster-object-factory = { git = "https://github.com/mikeblackett/dagster-object-factory.git" }

[tool.uv.workspace]
members = ["packages/*"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 79

[tool.ruff.lint]
extend-ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
